[package]
name = "omniroute-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Opt-in WebAssembly bindings for OmniRoute Rust crates (CNV-1, additive)"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "omniroute_wasm"
path = "src/lib.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
omniroute-gcf = { path = "../omniroute-gcf" }
omniroute-sse = { path = "../omniroute-sse" }
omniroute-compression = { path = "../omniroute-compression" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
