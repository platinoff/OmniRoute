[package]
name = "omniroute-compression"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compression pure utilities (validation, exclusions, preservation helpers) ported from OmniRoute open-sse (CNV-1 wave 3)"
repository.workspace = true

[lib]
name = "omniroute_compression"
path = "src/lib.rs"

[dependencies]
regex = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
fancy-regex = "0.14"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }