[workspace]
resolver = "2"
members = [
    "crates/omniroute-gcf",
    "crates/omniroute-compression",
    "crates/omniroute-sse",
    "crates/omniroute-napi",
    "crates/omniroute-wasm",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/diegosouzapw/OmniRoute"

[workspace.dependencies]
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
napi = { version = "2", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2"
napi-build = "2"
wasm-bindgen = "=0.2.108"

